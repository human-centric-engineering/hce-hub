<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="HCE Hub">
  <!--
    HCE Hub favicon (f-theme, t-106). The design-handoff brand mark, redrawn for
    a 16px canvas: the ink square from `components/brand/brand-mark.tsx` with its
    mono "H". Colours are the `[data-surface='consumer']` tokens of
    `app/brand-theme.css` — ink/paper in light, and the dim scope's inverse in
    dark — so the tab matches the sidebar it opens onto, in either theme.

    The "H" is drawn as a path rather than set in JetBrains Mono: a favicon is a
    standalone document with no access to the app's self-hosted fonts, and at
    16px an outline of the SemiBold "H" is indistinguishable from the real cut
    while costing no font payload. Slightly heavier stems than the true cut, on
    purpose — hairlines disappear at this size.

    Light is carried by presentation ATTRIBUTES and dark by the media query
    below, so a renderer that ignores the `<style>` block still gets correct
    light colours rather than defaulting both shapes to black. `public/favicon.ico`
    is rasterised from this file (16/32/48, light only — ICO cannot adapt); if you
    change the mark here, regenerate it.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .sq { fill: #e8e6e1; }
      .h  { fill: #1a1916; }
    }
  </style>
  <rect class="sq" width="32" height="32" rx="7" fill="#1a1a1a"/>
  <path class="h" fill="#faf8f3" d="M9 8h4v6h6V8h4v16h-4v-6h-6v6H9z"/>
</svg>
